name: roleplay-chat

on:
  push:
    branches: [main]
    paths:
      - 'roleplay-chat/**'
      - '.github/workflows/roleplay-chat.yml'
  pull_request:
    paths:
      - 'roleplay-chat/**'
      - '.github/workflows/roleplay-chat.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roleplay-chat
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: roleplay-chat/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
